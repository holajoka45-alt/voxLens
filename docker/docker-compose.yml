version: "3.8"

services:
  voxlens:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../:/app
      - ./data:/data
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      python -c "from voxlens.core import DiarizationPipeline; print('VoxLens OK')"

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../:/app
    command: pytest tests/ -v -m "not gpu and not audio"

  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../:/app
      - ./data:/data
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    stdin_open: true
    tty: true
